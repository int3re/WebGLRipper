<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Comparison: context created while the head is parsed</title>
<script>
// The WebGL context is created while the page head is still being parsed, as some engines and ad-hoc pages do.
const canvas = document.createElement('canvas');
canvas.width = canvas.height = 256;
const gl = canvas.getContext('webgl');
const vbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, 0, 0, 2, 0, 0, 0, 2, 0]), gl.STATIC_DRAW);
const p = gl.createProgram();
for (const [t, src] of [[gl.VERTEX_SHADER, 'attribute vec3 position; void main(){ gl_Position = vec4(position * 0.4 - 0.4, 1.0); }'],
	[gl.FRAGMENT_SHADER, 'precision mediump float; void main(){ gl_FragColor = vec4(0.2, 0.7, 1.0, 1.0); }']]) {
	const s = gl.createShader(t); gl.shaderSource(s, src); gl.compileShader(s); gl.attachShader(p, s);
}
gl.bindAttribLocation(p, 0, 'position'); gl.linkProgram(p);
</script></head>
<body style="margin:0"><script>
document.body.append(canvas);
(function frame() {
	gl.clearColor(0.1, 0.1, 0.1, 1); gl.clear(gl.COLOR_BUFFER_BIT);
	gl.useProgram(p); gl.bindBuffer(gl.ARRAY_BUFFER, vbo); gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
	gl.drawArrays(gl.TRIANGLES, 0, 3);
	requestAnimationFrame(frame);
})();
window.sceneReady = true;
</script></body></html>
