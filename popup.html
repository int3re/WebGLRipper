<!DOCTYPE html>
<html lang="en" class="i18n-pending">
<head>
	<meta charset="utf-8">
	<title>WebGL Ripper</title>
	<link rel="stylesheet" href="ui.css">
</head>
<body class="popup">
	<header class="brand">
		<img src="icons/icon32.png" alt="" width="28" height="28">
		<div>
			<h1>WebGL Ripper</h1>
			<span id="version" class="muted"></span>
		</div>
	</header>

	<div id="status" class="status" data-state="loading">
		<span class="dot"></span>
		<span id="status-text">Looking for WebGL content…</span>
	</div>

	<div id="canvases" class="canvases" hidden>
		<span class="label">On this page</span>
		<span id="canvas-list" class="chips"></span>
	</div>

	<div class="buttons">
		<button id="capture" class="primary" disabled>Rip next frame</button>
		<button id="pick" disabled title="Click an object in the page to rip only that object">Pick object</button>
	</div>
	<p id="detail" class="detail" hidden></p>

	<section id="last" class="last" hidden>
		<div class="last-head">
			<h2>Last rip</h2>
			<span id="last-meta" class="muted"></span>
		</div>
		<ul id="objects" class="objects"></ul>
		<p id="more" class="more muted" hidden></p>
		<p id="left-out" class="left-out" hidden></p>
	</section>

	<footer>
		<span><span>Rip</span> <kbd id="hotkey">Insert</kbd> · <span>Pick</span> <kbd id="pick-hotkey">Shift + Insert</kbd></span>
		<span class="links"><a href="#" id="open-history">History</a> · <a href="#" id="open-options">Options</a></span>
	</footer>

	<script src="settings.js"></script>
	<script src="i18n.js"></script>
	<script src="popup.js"></script>
</body>
</html>
