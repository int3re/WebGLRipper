<!DOCTYPE html>
<html lang="en" class="i18n-pending">
<head>
	<meta charset="utf-8">
	<title>WebGL Ripper History</title>
	<link rel="stylesheet" href="ui.css">
</head>
<body class="options history">
	<header>
		<img src="icons/icon48.png" alt="" width="40" height="40">
		<div>
			<h1>Rip history</h1>
			<span id="summary" class="muted"></span>
		</div>
		<button id="clear" type="button" hidden>Clear history</button>
	</header>

	<p id="empty" class="empty" hidden>
		<span>Nothing ripped yet.</span>
		<span id="empty-hint"></span>
	</p>
	<p id="disabled" class="empty" hidden>
		<span>The history is turned off.</span>
		<a href="#" id="open-options">Options</a>
	</p>

	<ol id="rips" class="rips"></ol>

	<script src="settings.js"></script>
	<script src="i18n.js"></script>
	<script src="history.js"></script>
</body>
</html>
